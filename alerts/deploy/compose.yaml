# banjir alerts on the VPS: the watcher/API and its own Cloudflare Tunnel.
# No host ports are published, so the firewall stays as it is. A separate
# Compose project from mykid, RustDesk and wg-easy — never touches them.
name: banjir-alerts

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: banjir-alerts-app
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - banjir-alerts-data:/data   # subscriptions + watcher state (SQLite)
    environment:
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is missing from deploy/.env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is missing from deploy/.env}
      OWNER_TOKEN: ${OWNER_TOKEN:?OWNER_TOKEN is missing from deploy/.env}
    networks: [banjir]
    healthcheck:
      # /healthz turns 503 when the watcher hasn't completed a run in 15 min.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is missing from deploy/.env}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      app:
        condition: service_healthy
    networks: [banjir]

networks:
  banjir: {}

volumes:
  banjir-alerts-data: {}
